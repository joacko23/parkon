server:
  port: 0
spring:
  application:
    name: auth-service
  datasource:
    # Replace 'parkon_db' with your actual database name
    url: jdbc:mysql://localhost:3306/auth-service?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    username: parkon
    password: parkon4321
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    show-sql: true
  config:
    import: optional:configserver:http://localhost:8888
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  tracing:
    sampling:
      probability: 1.0 # 1.0 = Trazar el 100% de las peticiones (bajar a 0.1 en Prod con alto tráfico)
    zipkin:
      tracing:
        endpoint: "http://tempo:9411/api/v2/spans" # URL del colector de trazas (Tempo o Zipkin)

logging:
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}]" # Fallback para logs de texto