input {
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  # Aquí puedes añadir lógica para identificar qué microservicio envía el log
  mutate {
    add_field => { "application" => "%{app_name}" }
  }
}

output {
   loki {
     url => "http://loki:3100/loki/api/v1/push"
     set_label => {
       "app" => "%{app_name}"    # Esto crea la etiqueta 'app'
       "level" => "%{level}"     # Esto crea la etiqueta 'level' que intentaste usar
     }
   }
 }