services:
  # 1. La Base de Datos
  auth-service-db:
    image: mysql:8.0
    container_name: auth-service-db
    environment:
      MYSQL_DATABASE: auth_service
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"

  # 2. Config Server (El primero en la jerarquía Spring)
  config-server:
    build:
      context: ./config-server
      dockerfile: Dockerfile
    container_name: config-server
    ports:
      - "8888:8888"

  # 3. Discovery Server (Eureka)
  discovery-server:
    build: ./service-discovery
    container_name: discovery-server
    ports:
      - "8761:8761"
    depends_on:
      - config-server

  # 4. Auth Service (Depende de DB y Eureka)
  auth-service:
    build: ./auth-service
    container_name: auth-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/auth_service?createDatabaseIfNoExists=true&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://discovery-server:8761/eureka/
    depends_on:
      - auth-service-db
      - discovery-server

  # 5. API Gateway (El punto de entrada)
  gateway-service:
    build: ./api-gateway
    container_name: gateway-service
    ports:
      - "8080:8080"
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://discovery-server:8761/eureka/
    depends_on:
      - discovery-server