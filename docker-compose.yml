services:
  # 1. La Base de Datos
  auth-service-db:
    image: mysql:8.0
    container_name: auth-service-db
    environment:
      MYSQL_DATABASE: auth_service
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"

  # 2. Config Server (El primero en la jerarquía Spring)
  config-server:
    build:
      context: ./config-server
      dockerfile: Dockerfile
    container_name: config-server
    ports:
      - "8888:8888"

  # 3. Discovery Server (Eureka)
  discovery-server:
    build: ./service-discovery
    container_name: discovery-server
    ports:
      - "8761:8761"
    depends_on:
      - config-server

  # 4. Auth Service (Depende de DB y Eureka)
  auth-service:
    build: ./auth-service
    container_name: auth-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/auth_service?createDatabaseIfNoExists=true&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://discovery-server:8761/eureka/
    depends_on:
      - auth-service-db
      - discovery-server

  # 5. API Gateway (El punto de entrada)
  gateway-service:
    build: ./api-gateway
    container_name: gateway-service
    ports:
      - "8080:8080"
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://discovery-server:8761/eureka/
    depends_on:
      - discovery-server


  # ==========================================
  # CAPA DE OBSERVABILIDAD (LGTM Stack)
  # ==========================================

  # 6. Loki (Logs)
  loki:
    image: grafana/loki:latest
    container_name: loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    networks:
      - parkon-net

  # 7. Tempo (Tracing)
  tempo:
    image: grafana/tempo:latest
    container_name: tempo
    command: [ "-config.file=/etc/tempo.yaml" ]
    ports:
      - "3200:3200" # Puerto HTTP interno
      - "9411:9411" # Puerto Zipkin (Donde Spring envía los datos)
    networks:
      - parkon-net

  # 8. Prometheus (Métricas)
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      # Necesitamos crear este archivo localmente (ver paso 2 abajo)
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - parkon-net

  # 9. Grafana (Visualización)
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - loki
      - tempo
      - prometheus
    networks:
      - parkon-net

networks:
  parkon-net:
    driver: bridge

